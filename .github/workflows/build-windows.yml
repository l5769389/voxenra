name: Build Windows packages

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "scripts/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：构建已有版本标签并上传到对应 Release，例如 v0.1.0"
        type: string
        required: false
        default: ""
      artifact_run_id:
        description: "可选：直接归档已有成功构建的 Run ID，须填写对应 release_tag"
        type: string
        required: false
        default: ""
      console:
        description: "生成带控制台的诊断版本"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-packages-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    if: inputs.artifact_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      app_name: ${{ steps.version.outputs.app_name }}
    env:
      PYTHONUTF8: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows

    steps:
      # 固定 Action 提交，避免上游标签变化导致构建行为改变。
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          BUILD_CONSOLE: ${{ inputs.console }}
        run: |
          uv run --locked --python 3.13 --no-dev python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          source = Path("scripts/packaging_utils.py").read_text(encoding="utf-8")
          name = re.search(r'^APP_NAME = "([A-Za-z0-9]+)"$', source, re.MULTILINE).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"app_name={name}\n")
          if tag:
              version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
              if tag != f"v{version}":
                  raise SystemExit(f"Release tag {tag!r} does not match project version v{version}")
              if os.environ["BUILD_CONSOLE"] == "true":
                  raise SystemExit("Console diagnostic builds cannot be published to a Release")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"release_tag={tag}\n")
          PY

      - name: Prepare regression diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force build/test-results | Out-Null

      - name: Verify native Windows caption
        env:
          QT_QPA_PLATFORM: windows
          QT_QUICK_BACKEND: software
          VOXENRA_NATIVE_QA: "1"
        run: uv run --locked --python 3.13 --group dev --group build python -m pytest tests/test_window_chrome.py -k windows_native_caption --junitxml=build/test-results/windows-native-caption.xml --basetemp=build/test-results/windows-native-caption

      - name: Verify native import dialog controls
        env:
          QT_QPA_PLATFORM: windows
          QT_QUICK_BACKEND: software
          VOXENRA_NATIVE_QA: "1"
        run: uv run --locked --python 3.13 --group dev --group build python -m pytest tests/test_import_dialog_chrome.py tests/test_import_ui.py --junitxml=build/test-results/windows-native-import.xml --basetemp=build/test-results/windows-native-import

      - name: Stress asynchronous QML transitions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          PYTHONUNBUFFERED: "1"
        shell: pwsh
        run: |
          foreach ($iteration in 1..3) {
            uv run --locked --python 3.13 --group dev --group build python tests/run_isolated.py tests/test_manual.py tests/test_tag_qml.py tests/test_display_completion.py tests/test_display_settings_qml.py tests/test_pacs_qml.py tests/test_mr_qml.py tests/test_failed_view_actions.py tests/test_view_opening.py --output "build/test-results/transitions-$iteration"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          PYTHONUNBUFFERED: "1"
        run: uv run --locked --python 3.13 --group dev --group build python tests/run_isolated.py

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Voxenra-windows-test-results
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Build single-file EXE
        shell: pwsh
        env:
          BUILD_CONSOLE: ${{ inputs.console }}
        run: |
          if ($env:BUILD_CONSOLE -eq "true") {
            & .\scripts\build_windows.bat --console
          } else {
            & .\scripts\build_windows.bat
          }
          exit $LASTEXITCODE

      - name: Verify portable pixel decoders
        shell: pwsh
        env:
          BUILD_CONSOLE: ${{ inputs.console }}
        run: |
          $exe = if ($env:BUILD_CONSOLE -eq "true") { "dist/Voxenra-debug.exe" } else { "dist/Voxenra.exe" }
          uv run --locked --python 3.13 --group build python scripts/verify_pixel_codecs.py --executable $exe
          exit $LASTEXITCODE

      - name: Prepare Inno Setup
        if: inputs.console != true
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          exit $LASTEXITCODE

      - name: Build Windows installer
        if: inputs.console != true
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Verify installer pixel decoders
        if: inputs.console != true
        run: uv run --locked --python 3.13 --group build python scripts/verify_pixel_codecs.py --executable dist/windows/Voxenra/Voxenra.exe

      - name: Verify default install directory and in-place upgrade
        if: inputs.console != true
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installers/*-setup.exe | Select-Object -First 1
          uv run --locked --python 3.13 --no-dev --group build python tests/manual/verify_windows_installer.py $setup.FullName
          exit $LASTEXITCODE

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Voxenra-windows-installer-results
          path: build/test-results/installer/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify embedded application icons
        shell: pwsh
        env:
          BUILD_APP_NAME: ${{ steps.version.outputs.app_name }}
        run: |
          $apps = @(Get-ChildItem dist/*.exe | ForEach-Object { $_.FullName })
          $installedApp = "dist/windows/${env:BUILD_APP_NAME}/${env:BUILD_APP_NAME}.exe"
          if (Test-Path $installedApp) {
            $apps += (Resolve-Path $installedApp).Path
          }
          uv run --locked --python 3.13 --no-dev --group build python tests/manual/verify_windows_icons.py --icon build/installer-assets/app.ico @apps
          exit $LASTEXITCODE

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe, dist/installers/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding utf8NoBOM
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.app_name }}-windows-x64${{ inputs.console && '-debug' || '' }}
          path: |
            dist/*.exe
            dist/*.sha256
            dist/installers/*.exe
            dist/installers/*.sha256
          if-no-files-found: error
          # 单文件 EXE 已压缩，避免重复压缩消耗构建时间。
          compression-level: 0
          retention-days: 14

  release:
    name: Publish Windows Release assets
    needs: build
    if: >-
      !cancelled() &&
      ((needs.build.result == 'success' && needs.build.outputs.release_tag != '') ||
       (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || needs.build.outputs.release_tag }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
      RELEASE_APP_NAME: ${{ needs.build.outputs.app_name }}

    steps:
      - name: Validate existing build provenance
        if: inputs.artifact_run_id != ''
        env:
          BUILD_CONSOLE: ${{ inputs.console }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import tomllib

          repo = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]
          run_id = os.environ["ARTIFACT_RUN_ID"]
          if not re.fullmatch(r"v[0-9][A-Za-z0-9.+-]*", tag) or not run_id.isdecimal():
              raise SystemExit("Provide a version release_tag and numeric artifact_run_id")
          if os.environ["BUILD_CONSOLE"] == "true":
              raise SystemExit("Console diagnostic builds cannot be published to a Release")

          def api(endpoint):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{endpoint}"], text=True))

          target = api(f"git/ref/tags/{tag}")["object"]
          while target["type"] == "tag":
              target = api(f"git/tags/{target['sha']}")["object"]
          run = api(f"actions/runs/{run_id}")
          if (target["type"] != "commit" or run["head_sha"] != target["sha"]
                  or run["status"] != "completed" or run["conclusion"] != "success"
                  or run["path"] != ".github/workflows/build-windows.yml"):
              raise SystemExit("Artifact must come from a successful Windows build of this exact tag commit")
          content = api(f"contents/pyproject.toml?ref={target['sha']}")
          project = tomllib.loads(base64.b64decode(content["content"]).decode("utf-8"))
          if tag != f"v{project['project']['version']}":
              raise SystemExit("Release tag does not match the source project version")
          branding = api(f"contents/scripts/packaging_utils.py?ref={target['sha']}")
          source = base64.b64decode(branding["content"]).decode("utf-8")
          name = re.search(r'^APP_NAME = "([A-Za-z0-9]+)"$', source, re.MULTILINE).group(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"RELEASE_APP_NAME={name}\n")
          print(f"Verified {name} build {run_id} at {target['sha']} for {tag}")
          PY

      - name: Download verified Windows packages
        run: gh run download "$ARTIFACT_RUN_ID" --name "$RELEASE_APP_NAME-windows-x64" --dir windows-packages

      - name: Prepare and verify Release assets
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          from pathlib import Path

          version = os.environ["RELEASE_TAG"][1:]
          app_name = os.environ["RELEASE_APP_NAME"]
          source = Path("windows-packages")
          destination = Path("release-assets")
          destination.mkdir()
          packages = {
              source / f"{app_name}.exe": f"{app_name}-{version}-windows-x64-portable.exe",
              source / "installers" / f"{app_name}-{version}-windows-x64-setup.exe": f"{app_name}-{version}-windows-x64-setup.exe",
          }
          for package, name in packages.items():
              checksum = package.with_suffix(".exe.sha256")
              expected_hash, expected_name = checksum.read_text(encoding="utf-8-sig").strip().split(maxsplit=1)
              with package.open("rb") as stream:
                  actual_hash = hashlib.file_digest(stream, "sha256").hexdigest()
              if expected_name != package.name or actual_hash != expected_hash:
                  raise SystemExit(f"Checksum mismatch: {package}")
              shutil.copyfile(package, destination / name)
              (destination / f"{name}.sha256").write_text(f"{actual_hash}  {name}\n", encoding="utf-8")
              print(f"Verified {name}: {actual_hash}")
          PY

      - name: Upload assets to matching Release
        run: |
          # 复用已有 Release；新标签先建立草稿，方便与 macOS 包一并发布。
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_APP_NAME $RELEASE_TAG" --generate-notes
          fi
          # 仅替换本版本 Windows 文件，保留 macOS 附件、说明和发布状态。
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
