name: Build native installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.13"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          PYTHONUTF8: "1"
        run: uv run --locked --python 3.13 --group dev --group build python tests/run_isolated.py --timeout 300
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VoxPlane-installer-test-results-${{ runner.os }}-${{ runner.arch }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Build macOS DMG (ad-hoc signed)
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh
      - name: Prepare Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify packaged macOS pixel decoders
        if: runner.os == 'macOS'
        run: uv run --locked --python 3.13 --group build python scripts/verify_pixel_codecs.py --executable dist/macos/VoxPlane.app/Contents/MacOS/VoxPlane
      - name: Verify packaged Windows pixel decoders
        if: runner.os == 'Windows'
        run: uv run --locked --python 3.13 --group build python scripts/verify_pixel_codecs.py --executable dist/windows/VoxPlane/VoxPlane.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VoxPlane-installer-${{ runner.os }}-${{ runner.arch }}
          path: dist/installers/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
