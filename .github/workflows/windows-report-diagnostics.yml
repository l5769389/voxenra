name: Diagnose Windows report exports

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit or branch to investigate"
        type: string
        required: true
        default: main
      iterations:
        description: "Fresh-process repetitions per configuration"
        type: number
        default: 5
      scenario:
        description: "Diagnostic scenario"
        type: choice
        options: [reports, volume]
        default: reports

permissions:
  contents: read

jobs:
  diagnose:
    if: inputs.scenario != 'volume'
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [offscreen, windows]
        preload_pdf: ["no", "yes"]
    env:
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VOXPLANE_NATIVE_QA: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows
      VOXPLANE_QA_PRELOAD_PDF: ${{ matrix.preload_pdf }}
      VOXPLANE_QA_ITERATIONS: ${{ inputs.iterations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Repeat real workspace and report tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/report-diagnostics | Out-Null
          @'
          import os
          import sys
          if os.environ['VOXPLANE_QA_PRELOAD_PDF'] == 'yes':
              from PySide6.QtCore import QBuffer, QIODevice, QRectF, Qt, QMarginsF
              from PySide6.QtGui import QPdfWriter, QPageSize, QPageLayout, QPainter, QFont, QColor, QFontMetricsF
          import pytest
          raise SystemExit(pytest.main(sys.argv[1:]))
          '@ | Set-Content build/report-diagnostics/runner.py
          $failed = $false
          for ($iteration = 1; $iteration -le [int]$env:VOXPLANE_QA_ITERATIONS; $iteration++) {
            uv run --locked --python 3.13 --group dev --group build python build/report-diagnostics/runner.py tests/test_workspace_persistence.py -vv --tb=short -o faulthandler_timeout=90 "--junitxml=build/report-diagnostics/round-$iteration.xml" *> "build/report-diagnostics/round-$iteration.log"
            $code = $LASTEXITCODE
            Get-Content "build/report-diagnostics/round-$iteration.log"
            "round=$iteration exit=$code" | Add-Content build/report-diagnostics/exits.txt
            if ($code -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Check QA reports and theme restoration
        run: uv run --locked --python 3.13 --group dev --group build python tests/run_isolated.py tests/test_theme_ui.py tests/test_water_qa_controller.py tests/test_water_qa_report.py --timeout 300 --output build/report-diagnostics/qa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: report-${{ matrix.platform }}-${{ matrix.preload_pdf }}
          path: build/report-diagnostics/
          retention-days: 14

  volume:
    if: inputs.scenario == 'volume'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: windows
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      VOXPLANE_NATIVE_QA: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare software OpenGL for native acceptance
        shell: pwsh
        run: ./scripts/prepare_windows_test_graphics.ps1
      - name: Diagnose native volume initialization
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          New-Item -ItemType Directory -Force build/volume-diagnostics | Out-Null
          uv run --locked --python 3.13 --group dev --group build python scripts/diagnose_windows_volume.py *> build/volume-diagnostics/native.log
          $code = $LASTEXITCODE
          Get-Content build/volume-diagnostics/native.log
          exit $code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-volume-diagnostics
          path: build/volume-diagnostics/
          retention-days: 14
