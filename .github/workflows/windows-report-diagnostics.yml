name: Diagnose Windows report exports

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit or branch to investigate"
        type: string
        required: true
        default: main
      iterations:
        description: "Fresh-process repetitions per configuration"
        type: number
        default: 5
      scenario:
        description: "Diagnostic scenario"
        type: choice
        options: [reports, volume, release, presets, lifecycle, native_stack]
        default: reports

permissions:
  contents: read

jobs:
  native_stack:
    if: inputs.scenario == 'native_stack'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: windows
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows
      VOXPLANE_QA_ITERATIONS: ${{ inputs.iterations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare synthetic test exception stack recorder
        shell: pwsh
        run: |
          ./scripts/prepare_windows_test_graphics.ps1
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          New-Item -ItemType Directory -Force build/native-stack | Out-Null
          @'
          #include <windows.h>
          #include <dbghelp.h>
          #include <stdio.h>
          #include <string.h>
          #include <wchar.h>
          static wchar_t output[MAX_PATH];
          static volatile LONG captured = 0;
          static LONG CALLBACK record(EXCEPTION_POINTERS *info) {
              if (info->ExceptionRecord->ExceptionCode != EXCEPTION_ACCESS_VIOLATION || InterlockedExchange(&captured, 1)) return EXCEPTION_CONTINUE_SEARCH;
              HANDLE process = GetCurrentProcess();
              SymRefreshModuleList(process);
              FILE *file = _wfopen(output, L"w");
              if (!file) return EXCEPTION_CONTINUE_SEARCH;
              CONTEXT context = *info->ContextRecord;
              STACKFRAME64 frame = {0};
              frame.AddrPC.Offset = context.Rip; frame.AddrPC.Mode = AddrModeFlat;
              frame.AddrStack.Offset = context.Rsp; frame.AddrStack.Mode = AddrModeFlat;
              frame.AddrFrame.Offset = context.Rbp; frame.AddrFrame.Mode = AddrModeFlat;
              fprintf(file, "Access violation; thread %lu\n", GetCurrentThreadId());
              for (int n=0; n<64; ++n) {
                  DWORD64 address = frame.AddrPC.Offset;
                  MEMORY_BASIC_INFORMATION memory;
                  char module[MAX_PATH] = "unknown";
                  DWORD64 base = 0;
                  if (VirtualQuery((void*)address, &memory, sizeof(memory))) {
                      base = (DWORD64)memory.AllocationBase;
                      GetModuleFileNameA((HMODULE)base, module, MAX_PATH);
                  }
                  char *name = strrchr(module, '\\'); name = name ? name+1 : module;
                  char buffer[sizeof(SYMBOL_INFO)+MAX_SYM_NAME] = {0};
                  SYMBOL_INFO *symbol = (SYMBOL_INFO*)buffer;
                  symbol->SizeOfStruct=sizeof(SYMBOL_INFO); symbol->MaxNameLen=MAX_SYM_NAME;
                  DWORD64 displacement=0;
                  fprintf(file, "%02d %s+0x%llx", n, name, address-base);
                  if (SymFromAddr(process,address,&displacement,symbol)) fprintf(file," %s+0x%llx",symbol->Name,displacement);
                  fprintf(file,"\n"); fflush(file);
                  if (!StackWalk64(IMAGE_FILE_MACHINE_AMD64,process,GetCurrentThread(),&frame,&context,NULL,SymFunctionTableAccess64,SymGetModuleBase64,NULL)) break;
              }
              fclose(file);
              return EXCEPTION_CONTINUE_SEARCH;
          }
          __declspec(dllexport) int install(const wchar_t *path) {
              wcscpy_s(output, MAX_PATH, path);
              SetErrorMode(SEM_FAILCRITICALERRORS | SEM_NOGPFAULTERRORBOX);
              SymSetOptions(SYMOPT_UNDNAME | SYMOPT_DEFERRED_LOADS | SYMOPT_FAIL_CRITICAL_ERRORS);
              if (!SymInitialize(GetCurrentProcess(), NULL, TRUE)) return 0;
              return AddVectoredExceptionHandler(1,record) != NULL;
          }
          '@ | Set-Content build/native-stack/recorder.c
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          @"
          @call "$vs/VC/Auxiliary/Build/vcvars64.bat"
          cl /nologo /LD /O2 build/native-stack/recorder.c /Febuild/native-stack/recorder.dll /link dbghelp.lib
          "@ | Set-Content build/native-stack/compile.cmd
          cmd /c build\native-stack\compile.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import ctypes, pathlib, sys
          import pytest
          recorder = ctypes.WinDLL(str(pathlib.Path('build/native-stack/recorder.dll').resolve()))
          recorder.install.argtypes=[ctypes.c_wchar_p]
          assert recorder.install(str(pathlib.Path('build/native-stack/stack.txt').resolve()))
          raise SystemExit(pytest.main(sys.argv[1:]))
          '@ | Set-Content build/native-stack/runner.py
      - name: Capture exception function addresses without process memory
        shell: pwsh
        run: |
          for ($iteration=1; $iteration -le [int]$env:VOXPLANE_QA_ITERATIONS; $iteration++) {
            uv run --locked --python 3.13 --group dev --group build python build/native-stack/runner.py tests/test_toolbar_categories.py -vv -s --tb=short *> "build/native-stack/round-$iteration.log"
            Get-Content "build/native-stack/round-$iteration.log"
            if (Test-Path build/native-stack/stack.txt) { break }
          }
          if (-not (Test-Path build/native-stack/stack.txt)) { throw 'No native exception captured' }
          Get-Content build/native-stack/stack.txt
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-native-stack
          path: |
            build/native-stack/stack.txt
            build/native-stack/round-*.log
          retention-days: 14

  lifecycle:
    if: inputs.scenario == 'lifecycle'
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [offscreen, windows]
        finish_pending: ["no", "yes"]
    env:
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows
      VOXPLANE_QA_ITERATIONS: ${{ inputs.iterations }}
      VOXPLANE_FINISH_PENDING: ${{ matrix.finish_pending }}
      PYTEST_ADDOPTS: "-s"
      PYTEST_PLUGINS: lifecycle_probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare native crash diagnostics
        shell: pwsh
        run: |
          ./scripts/prepare_windows_test_graphics.ps1
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          New-Item -ItemType Directory -Force build/lifecycle-diagnostics/dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$pwd\build\lifecycle-diagnostics\dumps" -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          @'
          import os
          from PySide6.QtCore import QObject
          from PySide6.QtQml import QQmlEngine, QQmlExpression
          def pytest_runtest_call(item):
              if item.name != 'test_settings_initializes_from_recent_image_and_does_not_reset_live_draft':
                  return
              import test_tab_windows
              original = test_tab_windows.detached
              def inspect(app, tab):
                  manager = app.windowManager
                  window = manager.windows[manager.mainWorkspace.windowId]
                  loader = window.findChild(QObject, 'workspaceLoader')
                  def status():
                      return QQmlExpression(QQmlEngine.contextForObject(loader), loader, 'Number(status)').evaluate()[0]
                  print('TRANSFER BEFORE:', status(), loader.property('asynchronous'), flush=True)
                  if os.environ['VOXPLANE_FINISH_PENDING'] == 'yes':
                      loader.setProperty('asynchronous', False)
                      print('TRANSFER COMPLETED:', status(), flush=True)
                  return original(app, tab)
              item._request.getfixturevalue('monkeypatch').setattr(test_tab_windows, 'detached', inspect)
          '@ | Set-Content build/lifecycle-diagnostics/lifecycle_probe.py
          "PYTHONPATH=$pwd\build\lifecycle-diagnostics" | Out-File $env:GITHUB_ENV -Append
      - name: Repeat confirmation and tab-transfer cases
        shell: pwsh
        run: |
          $failed = $false
          for ($iteration = 1; $iteration -le [int]$env:VOXPLANE_QA_ITERATIONS; $iteration++) {
            uv run --locked --python 3.13 --group dev --group build python tests/run_isolated.py tests/test_new_workspace_qml.py tests/test_toolbar_categories.py --workers 2 --timeout 180 --output "build/lifecycle-diagnostics/round-$iteration"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue | Format-List * | Out-File build/lifecycle-diagnostics/events.txt
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-lifecycle-${{ matrix.platform }}-${{ matrix.finish_pending }}
          path: build/lifecycle-diagnostics/
          retention-days: 14

  presets:
    if: inputs.scenario == 'presets'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: windows
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      VOXPLANE_NATIVE_QA: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows
      VOXPLANE_QA_ITERATIONS: ${{ inputs.iterations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare matching native graphics environment
        shell: pwsh
        run: |
          ./scripts/prepare_windows_test_graphics.ps1
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          New-Item -ItemType Directory -Force build/preset-diagnostics/dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$pwd\build\preset-diagnostics\dumps" -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Repeat native settings transitions with exact case names
        shell: pwsh
        run: |
          $failed = $false
          for ($iteration = 1; $iteration -le [int]$env:VOXPLANE_QA_ITERATIONS; $iteration++) {
            uv run --locked --python 3.13 --group dev --group build python -m pytest tests/test_presets_settings_qml.py -vv --tb=short -o faulthandler_timeout=90 "--junitxml=build/preset-diagnostics/round-$iteration.xml" *> "build/preset-diagnostics/round-$iteration.log"
            $code = $LASTEXITCODE
            Get-Content "build/preset-diagnostics/round-$iteration.log"
            "round=$iteration exit=$code" | Add-Content build/preset-diagnostics/exits.txt
            if ($code -ne 0) { $failed = $true }
          }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue | Format-List * | Out-File build/preset-diagnostics/events.txt
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-preset-diagnostics
          path: build/preset-diagnostics/
          retention-days: 14

  diagnose:
    if: inputs.scenario == 'reports'
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [offscreen, windows]
        preload_pdf: ["no", "yes"]
    env:
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VOXPLANE_NATIVE_QA: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows
      VOXPLANE_QA_PRELOAD_PDF: ${{ matrix.preload_pdf }}
      VOXPLANE_QA_ITERATIONS: ${{ inputs.iterations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Repeat real workspace and report tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/report-diagnostics | Out-Null
          @'
          import os
          import sys
          if os.environ['VOXPLANE_QA_PRELOAD_PDF'] == 'yes':
              from PySide6.QtCore import QBuffer, QIODevice, QRectF, Qt, QMarginsF
              from PySide6.QtGui import QPdfWriter, QPageSize, QPageLayout, QPainter, QFont, QColor, QFontMetricsF
          import pytest
          raise SystemExit(pytest.main(sys.argv[1:]))
          '@ | Set-Content build/report-diagnostics/runner.py
          $failed = $false
          for ($iteration = 1; $iteration -le [int]$env:VOXPLANE_QA_ITERATIONS; $iteration++) {
            uv run --locked --python 3.13 --group dev --group build python build/report-diagnostics/runner.py tests/test_workspace_persistence.py -vv --tb=short -o faulthandler_timeout=90 "--junitxml=build/report-diagnostics/round-$iteration.xml" *> "build/report-diagnostics/round-$iteration.log"
            $code = $LASTEXITCODE
            Get-Content "build/report-diagnostics/round-$iteration.log"
            "round=$iteration exit=$code" | Add-Content build/report-diagnostics/exits.txt
            if ($code -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Check QA reports and theme restoration
        run: uv run --locked --python 3.13 --group dev --group build python tests/run_isolated.py tests/test_theme_ui.py tests/test_water_qa_controller.py tests/test_water_qa_report.py --timeout 300 --output build/report-diagnostics/qa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: report-${{ matrix.platform }}-${{ matrix.preload_pdf }}
          path: build/report-diagnostics/
          retention-days: 14

  release:
    if: inputs.scenario == 'release'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare matching Windows graphics environment
        shell: pwsh
        run: |
          ./scripts/prepare_windows_test_graphics.ps1
      - name: Reproduce parallel window lifetime checks
        run: uv run --locked --python 3.13 --group dev --group build python tests/run_isolated.py tests/test_tab_windows.py tests/test_tag_qml.py tests/test_manual.py tests/test_pacs_qml.py tests/test_report_presets.py --workers 2 --timeout 900 --output build/release-diagnostics/parallel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-release-diagnostics
          path: build/release-diagnostics/
          retention-days: 14

  volume:
    if: inputs.scenario == 'volume'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: windows
      QT_QUICK_BACKEND: software
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      VOXPLANE_NATIVE_QA: "1"
      UV_PROJECT_ENVIRONMENT: .venv-build-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare software OpenGL for native acceptance
        shell: pwsh
        run: ./scripts/prepare_windows_test_graphics.ps1
      - name: Diagnose native volume initialization
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          New-Item -ItemType Directory -Force build/volume-diagnostics | Out-Null
          uv run --locked --python 3.13 --group dev --group build python scripts/diagnose_windows_volume.py *> build/volume-diagnostics/native.log
          $code = $LASTEXITCODE
          Get-Content build/volume-diagnostics/native.log
          exit $code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-volume-diagnostics
          path: build/volume-diagnostics/
          retention-days: 14
